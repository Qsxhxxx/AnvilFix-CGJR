 architectury {
    common("forge")
}

dependencies {
    // Architectury API（作为 mod 依赖以启用 Loom 重映射）
    modImplementation("dev.architectury:architectury:9.2.14")
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")
    
    // MixinExtras (参考项目版本 0.5.3)
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.3")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3")

    // ResourcefulConfig (Common API - CurseMaven Fabric 版本含 Common 类)
    compileOnly("curse.maven:resourceful-config-714059:5020442")
}
 
sourceSets {
    main {
        // 无特殊排除设置
    }
}
